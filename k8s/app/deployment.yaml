apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-defination
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project
  template:
    metadata:
      labels:
        app: project
    spec:
      containers:
        - name: project-container
          image: nginx:stable
          ports:
            - containerPort: 80

